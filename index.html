<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fridge Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#10B981;
    --mint-dark:#0B8F68;
    --mint-tint:#E3FBF3;
    --lemon:#FACC15;
    --lemon-tint:#FFF8DC;
    --white:#FFFFFF;
    --slate-card:#F3F4F6;
    --ink:#111827;
    --ink-soft:#4B5563;
    --ink-faint:#9CA3AF;
    --red:#F87171;
    --red-tint:#FEECEC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#E7E9EE;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .phone{
    width:390px;
    aspect-ratio:9/16;
    background:var(--white);
    border-radius:44px;
    box-shadow:0 30px 60px -20px rgba(17,24,39,0.35), 0 0 0 10px #17181C, 0 0 0 12px #2b2c30;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* status bar */
  .statusbar{
    height:34px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .notch{
    position:absolute;
    top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px;
    background:#17181C;
    border-radius:0 0 18px 18px;
    z-index:20;
  }

  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    background:var(--white);
  }

  /* header */
  .header{
    padding:6px 20px 14px;
    flex-shrink:0;
  }
  .header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .app-title{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  .app-title span{ color:var(--mint); }
  .profile-btn{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--slate-card);
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--white);
    box-shadow:0 0 0 1.5px #E5E7EB;
    flex-shrink:0;
  }
  .profile-btn svg{ width:18px; height:18px; }

  .search-wrap{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--slate-card);
    border-radius:14px;
    padding:11px 14px;
  }
  .search-wrap svg{ flex-shrink:0; width:17px; height:17px; color:var(--ink-faint); }
  .search-wrap input{
    border:none; background:transparent; outline:none;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
    width:100%;
  }
  .search-wrap input::placeholder{ color:var(--ink-faint); }

  .chips{
    display:flex;
    gap:8px;
    margin-top:12px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    padding:8px 15px;
    border-radius:100px;
    font-size:12.5px;
    font-weight:600;
    background:var(--slate-card);
    color:var(--ink-soft);
    cursor:pointer;
    border:1.5px solid transparent;
    transition:all .15s ease;
    user-select:none;
  }
  .chip.active{
    background:var(--mint);
    color:var(--white);
    box-shadow:0 4px 10px -3px rgba(16,185,129,0.55);
  }
  .chip:active{ transform:scale(0.96); }

  /* scroll area */
  .content{
    flex:1;
    overflow-y:auto;
    padding:16px 20px 100px;
    scrollbar-width:none;
  }
  .content::-webkit-scrollbar{ display:none; }

  .summary-bar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .summary-card{
    flex:1;
    background:var(--mint-tint);
    border-radius:16px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border:1px solid rgba(16,185,129,0.15);
  }
  .summary-card.warn{
    background:var(--lemon-tint);
    border:1px solid rgba(250,204,21,0.4);
  }
  .summary-num{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--mint-dark);
    line-height:1;
  }
  .summary-card.warn .summary-num{ color:#B45309; }
  .summary-label{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .summary-icon{
    font-size:15px;
  }

  .section-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin:4px 2px 10px;
  }

  /* item card */
  .card-stack{ display:flex; flex-direction:column; gap:12px; }

  .swipe-wrap{
    position:relative;
    border-radius:18px;
    overflow:hidden;
  }
  .delete-bg{
    position:absolute;
    inset:0;
    background:var(--red);
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:22px;
    border-radius:18px;
  }
  .delete-bg svg{ width:20px; height:20px; color:var(--white); }

  .item-card{
    position:relative;
    background:var(--slate-card);
    border-radius:18px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    touch-action:pan-y;
    transition:transform .25s cubic-bezier(.22,1,.36,1), opacity .25s ease;
    z-index:2;
  }
  .item-card.removing{
    transform:translateX(-110%) !important;
    opacity:0;
  }

  .thumb{
    width:52px; height:52px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    flex-shrink:0;
    background:var(--white);
    box-shadow:0 2px 6px rgba(17,24,39,0.06);
  }

  .item-info{ flex:1; min-width:0; }
  .item-top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }
  .item-name{
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-cat{
    font-size:11.5px;
    color:var(--ink-faint);
    font-weight:500;
    margin-top:1px;
  }

  .badge{
    flex-shrink:0;
    font-size:10.5px;
    font-weight:700;
    padding:4px 9px;
    border-radius:100px;
    white-space:nowrap;
  }
  .badge.soon{ background:var(--lemon); color:#7C5800; }
  .badge.fresh{ background:var(--mint); color:var(--white); }

  .meter-row{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:9px;
  }
  .meter-track{
    flex:1;
    height:5px;
    border-radius:100px;
    background:#E5E7EB;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    border-radius:100px;
  }
  .meter-text{
    font-size:10.5px;
    font-weight:600;
    color:var(--ink-soft);
    flex-shrink:0;
  }

  .qty-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
  }
  .qty-label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    background:var(--white);
    border-radius:100px;
    padding:3px;
    box-shadow:inset 0 0 0 1px #E5E7EB;
  }
  .step-btn{
    width:24px; height:24px;
    border-radius:50%;
    border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    color:var(--white);
    background:var(--mint);
    line-height:1;
    padding:0;
  }
  .step-btn.minus{ background:var(--ink);}
  .step-btn:active{ transform:scale(0.9); }
  .qty-val{
    width:34px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }

  /* FAB */
  .fab{
    position:absolute;
    right:20px;
    bottom:96px;
    width:58px; height:58px;
    border-radius:50%;
    background:var(--mint);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 24px -6px rgba(16,185,129,0.6), 0 0 0 6px rgba(16,185,129,0.12);
    cursor:pointer;
    z-index:30;
    border:none;
    transition:transform .15s ease;
  }
  .fab:active{ transform:scale(0.92); }
  .fab svg{ width:24px; height:24px; }

  /* bottom nav */
  .bottom-nav{
    position:absolute;
    left:0; right:0; bottom:0;
    background:var(--white);
    border-top:1px solid #EEF0F3;
    display:flex;
    flex-wrap:wrap;
    padding:10px 8px 4px;
    z-index:25;
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
    color:var(--ink-faint);
  }
  .nav-item svg{ width:21px; height:21px; }
  .nav-item span{ font-size:10px; font-weight:600; }
  .nav-item.active{ color:var(--mint); }
  .nav-dot{
    width:4px;height:4px;border-radius:50%;
    background:var(--mint);
    margin-top:-2px;
  }
  .footer-text{
    flex-basis:100%;
    text-align:center;
    font-size:9px;
    color:#9CA3AF;
    padding-top:8px;
    letter-spacing:0.02em;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-faint);
  }
  .empty-state .emoji{ font-size:38px; margin-bottom:10px; }
  .empty-state p{ font-size:13px; font-weight:600; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span>9:41</span>
    <span>🔋 100%</span>
  </div>

  <div class="app">
    <div class="header">
      <div class="header-row">
        <div class="app-title">Fridge <span>Inventory</span></div>
        <div class="profile-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.3-3.6 4-5.5 7-5.5s5.7 1.9 7 5.5"/></svg>
        </div>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search your fridge...">
      </div>

      <div class="chips" id="chipRow">
        <div class="chip active" data-filter="All">All</div>
        <div class="chip" data-filter="Produce">🥬 Produce</div>
        <div class="chip" data-filter="Dairy">🥛 Dairy</div>
        <div class="chip" data-filter="Meat">🍗 Meat</div>
        <div class="chip" data-filter="Expiring">⏳ Expiring Soon</div>
      </div>
    </div>

    <div class="content">
      <div class="summary-bar">
        <div class="summary-card">
          <div class="summary-icon">📦</div>
          <div class="summary-num" id="totalCount">24</div>
          <div class="summary-label">Total Items</div>
        </div>
        <div class="summary-card warn">
          <div class="summary-icon">⚠️</div>
          <div class="summary-num" id="expiringCount">3</div>
          <div class="summary-label">Expiring Soon</div>
        </div>
      </div>

      <div class="section-label">Your Items</div>
      <div class="card-stack" id="cardStack"></div>
    </div>

    <button class="fab" title="Add item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <div class="bottom-nav">
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span>Inventory</span>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18M6 3c3 0 3 4 0 4M18 3v7a2 2 0 01-4 0V3M16 10v11"/></svg>
        <span>Recipes</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2l1.5 5M18 2l-1.5 5M4 7h16l-1.5 12.5a2 2 0 01-2 1.5H7.5a2 2 0 01-2-1.5L4 7z"/></svg>
        <span>Shopping</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        <span>Settings</span>
      </div>
    </div>
    <div class="footer-text">Tapfone.com &copy; 2026</div>
  </div>
</div>

<script>
const items = [
  {id:1, name:"Organic Milk", cat:"Dairy", emoji:"🥛", qty:1, unit:"Bottle", days:2, status:"soon"},
  {id:2, name:"Fresh Strawberries", cat:"Produce", emoji:"🍓", qty:1, unit:"Box", days:5, status:"fresh"},
  {id:3, name:"Cheddar Cheese", cat:"Dairy", emoji:"🧀", qty:200, unit:"g", days:12, status:"fresh"},
  {id:4, name:"Chicken Breast", cat:"Meat", emoji:"🍗", qty:2, unit:"Pack", days:1, status:"soon"},
  {id:5, name:"Baby Spinach", cat:"Produce", emoji:"🥬", qty:1, unit:"Bag", days:3, status:"soon"},
  {id:6, name:"Greek Yogurt", cat:"Dairy", emoji:"🍶", qty:4, unit:"Cups", days:9, status:"fresh"},
  {id:7, name:"Ground Beef", cat:"Meat", emoji:"🥩", qty:1, unit:"lb", days:14, status:"fresh"},
  {id:8, name:"Bell Peppers", cat:"Produce", emoji:"🫑", qty:3, unit:"pcs", days:6, status:"fresh"},
];

let activeFilter = "All";
let searchTerm = "";

const stack = document.getElementById('cardStack');
const totalCountEl = document.getElementById('totalCount');
const expiringCountEl = document.getElementById('expiringCount');

function meterColor(status){
  return status === "soon" ? "linear-gradient(90deg,#FACC15,#F59E0B)" : "linear-gradient(90deg,#10B981,#34D399)";
}
function meterPercent(days){
  const pct = Math.max(6, Math.min(100, 100 - (days*5)));
  return status_pct(days);
}
function status_pct(days){
  // fewer days => fuller "urgency" bar visual; cap 100
  const pct = Math.max(10, 100 - (days*6));
  return Math.min(100, pct);
}

function render(){
  stack.innerHTML = "";
  const filtered = items.filter(it=>{
    const matchesFilter =
      activeFilter === "All" ? true :
      activeFilter === "Expiring" ? it.status === "soon" :
      it.cat === activeFilter;
    const matchesSearch = it.name.toLowerCase().includes(searchTerm.toLowerCase());
    return matchesFilter && matchesSearch;
  });

  totalCountEl.textContent = items.reduce((s,i)=>s+ (Number.isFinite(i.qty)?1:1),0) === items.length ? items.length : items.length;
  totalCountEl.textContent = items.length;
  expiringCountEl.textContent = items.filter(i=>i.status==="soon").length;

  if(filtered.length === 0){
    stack.innerHTML = `<div class="empty-state"><div class="emoji">🧊</div><p>No items match here.<br>Try another filter or search.</p></div>`;
    return;
  }

  filtered.forEach(it=>{
    const wrap = document.createElement('div');
    wrap.className = 'swipe-wrap';
    wrap.innerHTML = `
      <div class="delete-bg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
      </div>
      <div class="item-card" data-id="${it.id}">
        <div class="thumb">${it.emoji}</div>
        <div class="item-info">
          <div class="item-top-row">
            <div>
              <div class="item-name">${it.name}</div>
              <div class="item-cat">${it.cat} &middot; ${typeof it.qty === 'number' && it.unit==='g' ? it.qty+'g' : it.qty + ' ' + it.unit}</div>
            </div>
            <div class="badge ${it.status}">${it.status==='soon' ? 'Expires Soon' : 'Fresh'}</div>
          </div>
          <div class="meter-row">
            <div class="meter-track"><div class="meter-fill" style="width:${status_pct(it.days)}%; background:${meterColor(it.status)}"></div></div>
            <div class="meter-text">${it.days}d left</div>
          </div>
          <div class="qty-row">
            <div class="qty-label">Quantity</div>
            <div class="stepper">
              <button class="step-btn minus" data-action="dec" data-id="${it.id}">–</button>
              <div class="qty-val">${it.qty}</div>
              <button class="step-btn" data-action="inc" data-id="${it.id}">+</button>
            </div>
          </div>
        </div>
      </div>
    `;
    stack.appendChild(wrap);
    enableSwipe(wrap.querySelector('.item-card'));
  });
}

function enableSwipe(card){
  let startX = 0, currentX = 0, dragging = false;
  const id = card.dataset.id;

  card.addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX;
    dragging = true;
    card.style.transition = 'none';
  });
  card.addEventListener('touchmove', e=>{
    if(!dragging) return;
    currentX = e.touches[0].clientX - startX;
    if(currentX < 0){
      card.style.transform = `translateX(${Math.max(currentX, -100)}px)`;
    }
  });
  card.addEventListener('touchend', ()=>{
    dragging = false;
    card.style.transition = '';
    if(currentX < -60){
      removeItem(id, card);
    } else {
      card.style.transform = 'translateX(0)';
    }
    currentX = 0;
  });

  // mouse fallback for desktop preview
  card.addEventListener('mousedown', e=>{
    startX = e.clientX; dragging = true; card.style.transition='none';
    const onMove = (ev)=>{
      if(!dragging) return;
      currentX = ev.clientX - startX;
      if(currentX < 0) card.style.transform = `translateX(${Math.max(currentX,-100)}px)`;
    };
    const onUp = ()=>{
      dragging = false;
      card.style.transition = '';
      if(currentX < -60){ removeItem(id, card); }
      else card.style.transform = 'translateX(0)';
      currentX = 0;
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}

function removeItem(id, card){
  card.classList.add('removing');
  setTimeout(()=>{
    const idx = items.findIndex(i=>i.id == id);
    if(idx > -1) items.splice(idx,1);
    render();
  }, 220);
}

stack.addEventListener('click', e=>{
  const btn = e.target.closest('.step-btn');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const item = items.find(i=>i.id == id);
  if(!item) return;
  if(action === 'inc') item.qty = Number.isFinite(item.qty) ? item.qty + 1 : item.qty;
  if(action === 'dec') item.qty = Number.isFinite(item.qty) ? Math.max(item.unit==='g'?0:1, item.qty - (item.unit==='g'?50:1)) : item.qty;
  render();
});

document.getElementById('chipRow').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  render();
});

document.getElementById('searchInput').addEventListener('input', e=>{
