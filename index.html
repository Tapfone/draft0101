<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Snowman</title>

<style>
:root {
  --blue: #087fc1;
  --dark: #07345c;
  --red: #e63946;
  --green: #16865b;
  --white: #ffffff;
  --light: #eaf7ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Trebuchet MS', Arial, sans-serif;
  background: #eaf7ff;
  color: var(--dark);
  overflow-x: hidden;
}

header {
  background: linear-gradient(135deg,#063b70,#0789c8);
  color: white;
  padding: 30px 18px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

header h1 {
  font-size: clamp(30px,6vw,55px);
  margin: 10px 0;
  text-shadow: 2px 3px 5px #00334d;
}

header p {
  font-size: 17px;
}

.snowman-icon {
  font-size: 65px;
}

nav {
  background: #06345e;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 13px;
  position: sticky;
  top: 0;
  z-index: 10;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 25px;
  transition: .3s;
}

nav a:hover {
  background: #e63946;
}

.hero {
  min-height: 430px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 35px 20px;
  background: linear-gradient(#b5e5ff,#f5fcff);
}

.hero img {
  width: min(90%,600px);
  height: 280px;
  object-fit: cover;
  border-radius: 22px;
  box-shadow: 0 8px 25px #245a7b55;
}

.hero h2 {
  font-size: 32px;
  margin: 18px 0 8px;
}

.hero p {
  font-size: 17px;
}

section {
  padding: 45px 20px;
  max-width: 1200px;
  margin: auto;
}

.section-title {
  text-align: center;
  font-size: 30px;
  margin-bottom: 25px;
  color: #087fc1;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 22px;
}

.card {
  background: white;
  border-radius: 17px;
  overflow: hidden;
  box-shadow: 0 5px 18px #174d7020;
  transition: .3s;
}

.card:hover {
  transform: translateY(-7px);
  box-shadow: 0 12px 25px #174d7040;
}

.card a {
  display: block;
  color: inherit;
  text-decoration: none;
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 17px;
  text-align: center;
}

.card h3 {
  color: #087fc1;
  margin-bottom: 8px;
}

.card p {
  font-size: 14px;
  line-height: 1.5;
}

.tag {
  display: inline-block;
  background: #e4f5ff;
  padding: 5px 12px;
  border-radius: 20px;
  margin-top: 10px;
  color: #087fc1;
  font-size: 12px;
}

.features {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
  gap: 18px;
}

.feature {
  background: white;
  text-align: center;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 4px 15px #0001;
}

.feature .emoji {
  font-size: 45px;
}

.feature h3 {
  margin: 12px 0;
  color: #087fc1;
}

.greeting {
  background: linear-gradient(135deg,#087fc1,#06345e);
  color: white;
  text-align: center;
  padding: 40px 20px;
  border-radius: 20px;
}

.greeting h2 {
  font-size: 30px;
  margin-bottom: 15px;
}

#greetingText {
  font-size: 21px;
  min-height: 55px;
  margin: 20px auto;
}

button {
  border: none;
  background: #e63946;
  color: white;
  padding: 12px 22px;
  border-radius: 25px;
  font-size: 15px;
  cursor: pointer;
  margin: 5px;
  transition: .3s;
}

button:hover {
  background: #b91f30;
  transform: scale(1.04);
}

.snow-control {
  background: #087fc1;
}

footer {
  background: #052b4d;
  color: white;
  padding: 30px 15px;
  text-align: center;
  margin-top: 40px;
}

footer a {
  color: #9cddff;
  text-decoration: none;
}

.snowflake {
  position: fixed;
  top: -20px;
  color: white;
  pointer-events: none;
  z-index: 20;
  animation: fall linear forwards;
  text-shadow: 0 0 5px #65a6d5;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: .3;
  }
}

.dark-mode {
  background: #102a43;
  color: white;
}

.dark-mode .card,
.dark-mode .feature {
  background: #193b59;
  color: white;
}

.dark-mode .card h3,
.dark-mode .feature h3 {
  color: #8ed8ff;
}

.dark-mode .hero {
  background: #173d5c;
  color: white;
}

.dark-mode .section-title {
  color: #8ed8ff;
}

@media(max-width:600px) {
  nav {
    gap: 2px;
  }
  nav a {
    padding: 9px;
    font-size: 13px;
  }
  .hero img {
    height: 220px;
  }
  section {
    padding: 32px 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="snowman-icon">☃️</div>
  <h1>Christmas Snowman
