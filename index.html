
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Countdown | Tapfone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #10291e;
    font-family: 'Arial', sans-serif;
    overflow-x: hidden;
    color: white;
}

.app {
    width: 100%;
    max-width: 430px;
    aspect-ratio: 9 / 16;
    min-height: 650px;
    max-height: 850px;
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 30px 22px;
    background:
        radial-gradient(circle at top, #286441, transparent 48%),
        linear-gradient(160deg, #17452e, #09251a 80%);
    border: 4px solid #d8ad50;
    border-radius: 25px;
    box-shadow: 0 15px 50px #0008;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.snow {
    position: absolute;
    top: -20px;
    color: white;
    pointer-events: none;
    animation: snowfall linear infinite;
    z-index: 1;
    opacity: 0.8;
}

@keyframes snowfall {
    0% {
        transform: translateY(-20px) translateX(0);
        opacity: 0;
    }
    15% { opacity: 0.9; }
    100% {
        transform: translateY(900px) translateX(45px);
        opacity: 0;
    }
}

.content {
    position: relative;
    z-index: 2;
    width: 100%;
}

.top-decoration {
    font-size: 43px;
    margin: 10px 0 8px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { filter: drop-shadow(0 0 3px #ffdc75); }
    to { filter: drop-shadow(0 0 16px #ffdc75); }
}

h1 {
    color: #ffdf87;
    font-size: 37px;
    font-family: Georgia, serif;
    text-shadow: 2px 3px 5px #0008;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 15px;
    color: #e8f3e9;
    letter-spacing: 2px;
    margin-bottom: 22px;
}

.tree {
    font-size: 105px;
    line-height: 1.2;
    margin: 5px 0 15px;
    filter: drop-shadow(0 5px 10px #0008);
}

.message {
    color: #ffdf87;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 20px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
}

.time-box {
    background: linear-gradient(145deg, #fff, #e7e7e7);
    border: 2px solid #e0b84f;
    border-radius: 13px;
    padding: 14px 3px;
    color: #155033;
    box-shadow: 0 5px 12px #0005;
}

.number {
    display: block;
    font-size: 30px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

.label {
    display: block;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 5px;
}

.date {
    color: #fff1c1;
    font-size: 15px;
    margin-top: 22px;
    line-height: 1.7;
}

.divider {
    width: 75%;
    height: 2px;
    background: #d9b65c;
    margin: 22px auto;
}

.greeting {
    font-family: Georgia, serif;
    font-size: 24px;
    color: #ffdf87;
    margin-bottom: 8px;
}

.description {
    color: #e2eee4;
    font-size: 13px;
    line-height: 1.6;
}

.decorations {
    font-size: 27px;
    margin-top: 22px;
    letter-spacing: 8px;
}

.footer {
    margin-top: auto;
    padding-top: 15px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #e8d69c;
    position: relative;
    z-index: 2;
}

@media (max-width: 450px) {
    body {
        background: #10291e;
    }

    .app {
        border-radius: 0;
        border-width: 3px;
        min-height: 100svh;
        max-height: none;
        aspect-ratio: auto;
    }
}

@media (max-height: 720px) {
    .app {
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .tree {
        font-size: 75px;
    }

    .divider {
        margin: 12px auto;
    }

    .top-decoration {
        margin-top: 3px;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <div class="content">

        <div class="top-decoration">🎅 🎄 ⭐ 🎄 🎅</div>

        <h1>Christmas</h1>
        <div class="subtitle">COUNTDOWN</div>

        <div class="tree">🎄</div>

        <div class="message" id="message">
            Christmas is Coming!
        </div>

        <div class="countdown">

            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">HOURS</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">MINS</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">SECS</span>
            </div>

        </div>

        <div class="date">
            🎁 December 25, <span id="year"></span> 🎁
        </div>

        <div class="divider"></div>

        <div class="greeting" id="greeting">
            ✨ Merry Christmas! ✨
        </div>

        <div class="description">
            May your holidays be filled with
            love, joy, happiness and magic!
        </div>

        <div class="decorations">
            🎁 ❄️ 🔔 ❄️ 🎁
        </div>

    </div>

    <div class="footer">
        Tapfone © 2026
    </div>

</div>

<script>

// Create falling snow
function createSnow() {
    const app = document.getElementById("app");

    for (let i = 0; i < 35; i++) {
        const snow = document.createElement("div");

        snow.className = "snow";
        snow.innerHTML = "❄";

        snow.style.left = Math.random() * 100 + "%";
        snow.style.fontSize = (8 + Math.random() * 15) + "px";
        snow.style.animationDuration =
            (5 + Math.random() * 10) + "s";

        snow.style.animationDelay =
            (Math.random() * 10) + "s";

        app.appendChild(snow);
    }
}

// Find the next Christmas
function getChristmas() {
    const now = new Date();
    let year = now.getFullYear();

    let christmas = new Date(year, 11, 25, 0, 0, 0);

    if (now >= christmas) {
        year++;
        christmas = new Date(year, 11, 25, 0, 0, 0);
    }

    return christmas;
}

// Countdown timer
function updateCountdown() {

    const now = new Date();
    const christmas = getChristmas();

    const difference = christmas - now;

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (difference / 1000) % 60
    );

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

    document.getElementById("year").textContent =
        christmas.getFullYear();

    if (days === 0 && hours === 0 && minutes === 0 &&
        seconds === 0) {

        document.getElementById("message").textContent =
            "🎄 Merry Christmas! 🎄";

        document.getElementById("greeting").textContent =
            "🎅 It's Christmas Day! 🎅";

    } else if (days <= 7) {

        document.getElementById("message").textContent =
            "🎁 Almost Christmas!";

    } else {

        document.getElementById("message").textContent =
            "Christmas is Coming!";
    }
}

// Start app
createSnow();
updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
